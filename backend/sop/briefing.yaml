name: "每日简报生成"
description: "采集邮件、RSS、社交媒体数据，生成汇总简报"
version: "1.0"

steps:
  - name: "数据采集"
    type: "parallel"          # 并行执行多个智能体
    agents:
      - email_agent
      - news_agent
      - social_agent
    timeout: 30
    retry: 2

  - name: "数据清洗与优先级判断"
    type: "sequential"
    agents:
      - priority_agent
    timeout: 15
    retry: 1

  - name: "生成简报"
    type: "sequential"
    agents:
      - intent_agent          # 实际可能是摘要生成模型
    timeout: 20
    retry: 1

  - name: "质量验证"
    type: "sequential"
    agents:
      - validator_agent
    timeout: 10
    retry: 1

  - name: "推送"
    type: "sequential"
    agents:
      - outbound_agent        # 推送到飞书/Notion等
    timeout: 15
    retry: 2