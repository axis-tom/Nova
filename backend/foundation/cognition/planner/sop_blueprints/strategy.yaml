name: "战略推演"
description: "分析财务数据、市场动态，生成增长建议"
version: "1.0"

steps:
  - name: "财务数据分析"
    type: "sequential"
    agents:
      - financial_advisor
    timeout: 30
    retry: 1

  - name: "市场动态分析"
    type: "parallel"
    agents:
      - competitor_agent
      - news_agent
    timeout: 30
    retry: 2

  - name: "增长建议生成"
    type: "sequential"
    agents:
      - growth_advisor
    timeout: 25
    retry: 1

  - name: "知识库匹配"
    type: "sequential"
    agents:
      - knowledge_advisor
    timeout: 15
    retry: 1
